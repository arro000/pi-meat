name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.13"
          cache: false
      - name: Validate tag and package version
        run: |
          version=$(node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; process.stdout.write(pkg.version)')
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run release:check
      - name: Publish npm package
        run: npm publish --access public --provenance
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "pi-meat ${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
