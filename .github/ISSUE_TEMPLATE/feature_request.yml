name: Feature request
description: Propose focused pi-meat improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe user flow, not only implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Existing workflows or smaller options considered
  - type: textarea
    id: risks
    attributes:
      label: Privacy, security, and compatibility impact
      description: Data flow, child process, provider, cache, terminal, or dependency changes
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and roadmap.
          required: true
        - label: I can help test or implement this change.
