name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: bridge/go.sum
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build:bridge
